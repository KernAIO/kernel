name: CI
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true
permissions: { contents: read, packages: read }
jobs:
  changeset:
    # publish.yml infers a changeset from the commit when none was written, so a missing one is no
    # longer a silent failure. The exception is a breaking change: whether an exported type changed
    # shape is not visible in a commit subject, and publishing one as a patch is what a caret range
    # then installs silently. That call stays with the author, and this is where they find out.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: A breaking change under packages/ needs a changeset
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No comparable base commit — skipping."; exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE" "${{ github.sha }}")
          if ! echo "$CHANGED" | grep -q '^packages/'; then
            echo "Nothing under packages/ changed."; exit 0
          fi
          if echo "$CHANGED" | grep -qE '^\.changeset/.*\.md$'; then
            echo "Changeset present."; exit 0
          fi
          LOG=$(git log --format=%B "$BASE..${{ github.sha }}")
          if echo "$LOG" | grep -qE '^[a-z]+(\([^)]*\))?!:' || echo "$LOG" | grep -q 'BREAKING CHANGE'; then
            echo "::error::This declares a breaking change but carries no changeset. Run 'pnpm changeset' and say which packages break and how — publish.yml will not guess a major bump."
            exit 1
          fi
          echo "No changeset, no breaking change — publish.yml will infer one from the commit."

  check:
    runs-on: ubuntu-latest
    # The kernel's own migration and maintenance tests need a real Postgres: an advisory lock and a
    # `create schema if not exists` race cannot be faked, and skipping them in CI is how the race
    # they cover reaches an instance.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: kern
          POSTGRES_PASSWORD: kern
          POSTGRES_DB: kern
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kern"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # 127.0.0.1, never localhost: a runner resolves localhost to ::1 first, where the published
      # port is not listening, and node does not retry over IPv4.
      DATABASE_URL: postgres://kern:kern@127.0.0.1:5432/kern
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install; fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
